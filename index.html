<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>click&cut · Tu Tienda Digital</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            lino: '#FBF9F5',
            arena: '#EFE7DC',
            arenaBorde: '#E4D9C8',
            salvia: '#7DB59A',
            salviaDark: '#2E6B4B',
            salviaSuave: '#EBF4F0',
            terracota: '#B95D55',
            durazno: '#F5C2A5',
            moradoPastel: '#F3EEF9',
            moradoBorde: '#D8C6EE',
            texto: '#2B2927',
            textoMuted: '#7E7873'

      }

  </script>

  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      background-color: #FBF9F5;
      color: #2B2927;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .font-mono-numbers {
      font-variant-numeric: tabular-nums;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="selection:bg-durazno selection:text-texto">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // Formateador MXN
    const formatMXN = (val) => new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN', maximumFractionDigits: 0 }).format(val);

    // --- DATOS INICIALES ---
    const INITIAL_CONFIG = {
      storeName: 'click&cut · Tu Tienda Digital',
      tagline: 'Cuentas streaming, perfiles privados y licencias digitales',
      logoIcon: '🌿',
      coverUrl: 'https://images.unsplash.com/photo-1507652313519-d4e9174996dd?auto=format&fit=crop&w=1200&q=80',
      pin: '2408'
    };

    const INITIAL_PRODUCTS = [
      { id: '1', name: 'Netflix 1 Pantalla (Perfil con PIN)', code: 'CC-NFLX-PIN', category: 'Perfiles / Pantallas', type: 'Streaming', stock: 14, price: 85, cost: 40, provider: 'Proveedor Alex (Telegram)' },
      { id: '2', name: 'Disney+ Estándar (Perfil)', code: 'CC-DSNY-01', category: 'Perfiles / Pantallas', type: 'Streaming', stock: 8, price: 50, cost: 22, provider: 'Proveedor Alex (Telegram)' },
      { id: '3', name: 'Max Platino 4K (Perfil)', code: 'CC-MAX-01', category: 'Perfiles / Pantallas', type: 'Streaming', stock: 7, price: 55, cost: 25, provider: 'Digital Express' },
      { id: '4', name: 'Spotify Premium Individual (Cuenta)', code: 'CC-SPOT-IND', category: 'Cuentas Completas', type: 'Música', stock: 6, price: 65, cost: 30, provider: 'Mayorista Alex' },
      { id: '5', name: 'Prime Video 6 Meses (Perfil)', code: 'CC-PRIME-06', category: 'Perfiles / Pantallas', type: 'Streaming', stock: 2, price: 45, cost: 18, provider: 'Digital Express' },
      { id: '6', name: 'YouTube Premium 1 Mes (Cuenta)', code: 'CC-YT-01', category: 'Cuentas Completas', type: 'Streaming', stock: 1, price: 45, cost: 20, provider: 'Digital Express' },
      { id: '7', name: 'Crunchyroll Fan (Cuenta)', code: 'CC-CRU-01', category: 'Cuentas Completas', type: 'Streaming', stock: 0, price: 50, cost: 24, provider: 'Proveedor Alex (Telegram)' }
    ];

    const INITIAL_PROVIDERS = [
      {
        id: '1',
        name: 'Proveedor Alex (Telegram)',
        channel: 'Telegram: @AlexStreamVIP · WA: +52 55 8312 9901',
        broadcast: 'Canal Telegram: Lotes VIP Streaming 24/7',
        updated: '2026-10-03',
        status: 'Lote Activo',
        catalog: [
          { service: 'Netflix 1 Pantalla (Perfil con PIN)', cost: 40, stock: 25 },
          { service: 'Disney+ Estándar (Perfil)', cost: 22, stock: 15 },
          { service: 'Max Platino 4K (Perfil)', cost: 26, stock: 10 },
          { service: 'Crunchyroll Fan (Cuenta)', cost: 24, stock: 8 },
          { service: 'Paramount+ Perfil', cost: 18, stock: 12 }
        ]
      },
      {
        id: '2',
        name: 'Mayorista Alex Streaming',
        channel: 'WhatsApp (+52 1 81 2345 6789)',
        broadcast: 'Grupo WhatsApp: Reposiciones diarias',
        updated: '2026-10-02',
        status: 'Lote Activo',
        catalog: [
          { service: 'Spotify Premium Individual (Cuenta)', cost: 30, stock: 20 },
          { service: 'Netflix 1 Pantalla (Perfil con PIN)', cost: 42, stock: 18 }
        ]
      },
      {
        id: '3',
        name: 'Digital Express',
        channel: 'Telegram: @DigitalExpressOficial',
        broadcast: 'Canal Telegram: Entrega automatizada bot',
        updated: '2026-10-01',
        status: 'Lote Activo',
        catalog: [
          { service: 'Max Platino 4K (Perfil)', cost: 24, stock: 14 },
          { service: 'Prime Video 6 Meses (Perfil)', cost: 18, stock: 9 },
          { service: 'YouTube Premium 1 Mes (Cuenta)', cost: 20, stock: 7 }
        ]
      }
    ];

    const INITIAL_SUBSCRIPTIONS = [
      { id: '1', client: 'Carlos Mendoza', service: 'Netflix 1 Pantalla (Perfil con PIN)', profile: 'Perfil 1 · PIN: 2408', endDate: '2026-10-05', price: 85, cost: 40 },
      { id: '2', client: 'Mariana Reyes', service: 'Disney+ Estándar (Perfil)', profile: 'Perfil 3', endDate: '2026-10-04', price: 50, cost: 22 },
      { id: '3', client: 'Luis Garza', service: 'Max Platino 4K (Perfil)', profile: 'Perfil Adulto', endDate: '2026-10-20', price: 55, cost: 25 }
    ];

    const PRESET_COVERS = [
      { id: 'streaming', label: 'Streaming', url: 'https://images.unsplash.com/photo-1522869635100-9f4c5e86aa37?auto=format&fit=crop&w=1200&q=80' },
      { id: 'clickandcut', label: 'click&cut', url: 'https://images.unsplash.com/photo-1507652313519-d4e9174996dd?auto=format&fit=crop&w=1200&q=80' },
      { id: 'botanica', label: 'Botánica', url: 'https://images.unsplash.com/photo-1518531933037-91b2f5f229cc?auto=format&fit=crop&w=1200&q=80' }
    ];

    function App() {
      // Estado de Configuración y Personalización Privada
      const [config, setConfig] = useState(() => {
        const saved = localStorage.getItem('cnc_config');
        return saved ? JSON.parse(saved) : INITIAL_CONFIG;
      });

      const [isLocked, setIsLocked] = useState(true);
      const [pinInput, setPinInput] = useState('');
      const [pinError, setPinError] = useState(false);

      // Datos principales
      const [products, setProducts] = useState(() => {
        const saved = localStorage.getItem('cnc_products');
        return saved ? JSON.parse(saved) : INITIAL_PRODUCTS;
      });

      const [providers, setProviders] = useState(() => {
        const saved = localStorage.getItem('cnc_providers');
        return saved ? JSON.parse(saved) : INITIAL_PROVIDERS;
      });

      const [subscriptions, setSubscriptions] = useState(() => {
        const saved = localStorage.getItem('cnc_subscriptions');
        return saved ? JSON.parse(saved) : INITIAL_SUBSCRIPTIONS;
      });

      const [notes, setNotes] = useState(() => {
        const saved = localStorage.getItem('cnc_loose_notes');
        return saved ? JSON.parse(saved) : [
          { id: '1', title: 'Promo Alex Fin de Semana', text: 'Cuentas completas de Disney a $130 si compramos 3 juntas.', date: '2026-10-02' },
          { id: '2', title: 'Nueva App Viki Rakuten', text: 'Varios clientes han pedido doramas asiáticos, cotizar mayoristas.', date: '2026-10-01' }
        ];
      });

      const [logs, setLogs] = useState(() => {
        const saved = localStorage.getItem('cnc_logs');
        return saved ? JSON.parse(saved) : [
          { id: '1', date: new Date().toISOString(), type: 'Altas', desc: 'Sistema Click&Cut inicializado con éxito', amount: 0, profit: 0 }
        ];
      });

      // Vistas y filtros
      const [currentView, setCurrentView] = useState('inventory'); // 'inventory' | 'providers' | 'renewals'
      const [providerSubTab, setProviderSubTab] = useState('lotes'); // 'lotes' | 'comparativa' | 'notas'
      const [selectedProviderIndex, setSelectedProviderIndex] = useState(0);
      const [searchQuery, setSearchQuery] = useState('');
      const [stockFilter, setStockFilter] = useState('todos'); // 'todos' | 'en_stock' | 'por_terminarse' | 'agotados'
      const [categoryFilter, setCategoryFilter] = useState('Todos');

      // Modales
      const [showSettingsModal, setShowSettingsModal] = useState(false);
      const [showTicketModal, setShowTicketModal] = useState(false);
      const [showCashClose, setShowCashClose] = useState(false);
      const [showProductModal, setShowProductModal] = useState(false);
      const [showNewProviderModal, setShowNewProviderModal] = useState(false);
      const [showNewNoteModal, setShowNewNoteModal] = useState(false);
      const [editingProduct, setEditingProduct] = useState(null);

      // Estado del Ticket
      const [ticketClient, setTicketClient] = useState('Cliente');
      const [ticketService, setTicketService] = useState('Netflix 1 Pantalla (Perfil con PIN)');
      const [ticketAmount, setTicketAmount] = useState('85');
      const [ticketAccess, setTicketAccess] = useState('Perfil privado con PIN');

      // Estado de Carga Masiva de Proveedor
      const [newProvName, setNewProvName] = useState('');
      const [newProvContact, setNewProvContact] = useState('');
      const [newProvChannel, setNewProvChannel] = useState('');
      const [rawBatchText, setRawBatchText] = useState('');

      // Sincronización en LocalStorage
      useEffect(() => localStorage.setItem('cnc_config', JSON.stringify(config)), [config]);
      useEffect(() => localStorage.setItem('cnc_products', JSON.stringify(products)), [products]);
      useEffect(() => localStorage.setItem('cnc_providers', JSON.stringify(providers)), [providers]);
      useEffect(() => localStorage.setItem('cnc_subscriptions', JSON.stringify(subscriptions)), [subscriptions]);
      useEffect(() => localStorage.setItem('cnc_loose_notes', JSON.stringify(notes)), [notes]);
      useEffect(() => localStorage.setItem('cnc_logs', JSON.stringify(logs)), [logs]);

      // Bitácora helper
      const addLog = (type, desc, amount = 0, profit = 0) => {
        setLogs(prev => [{ id: Date.now().toString(), date: new Date().toISOString(), type, desc, amount, profit }, ...prev]);
      };

      // Control del PIN
      const handlePinPress = (digit) => {
        if (pinInput.length < 4) {
          const next = pinInput + digit;
          setPinInput(next);
          if (next.length === 4) {
            if (next === config.pin) {
              setIsLocked(false);
              setPinInput('');
              setPinError(false);
            } else {
              setPinError(true);
              setTimeout(() => {
                setPinInput('');
                setPinError(false);
              }, 600);
            }
          }
        }
      };

      // Métricas Principales de Inventario
      const metrics = useMemo(() => {
        const totalScreens = products.reduce((acc, p) => acc + (p.stock || 0), 0);
        const potentialProfit = products.reduce((acc, p) => acc + ((p.price - p.cost) * p.stock), 0);
        const lowStockCount = products.filter(p => p.stock > 0 && p.stock <= 2).length;
        const outOfStockCount = products.filter(p => p.stock === 0).length;
        return { totalScreens, potentialProfit, lowStockCount, outOfStockCount };
      }, [products]);

      // Productos filtrados
      const filteredProducts = useMemo(() => {
        return products.filter(p => {
          if (categoryFilter !== 'Todos' && p.category !== categoryFilter) return false;
          if (stockFilter === 'en_stock' && p.stock === 0) return false;
          if (stockFilter === 'por_terminarse' && (p.stock > 2 || p.stock === 0)) return false;
          if (stockFilter === 'agotados' && p.stock > 0) return false;
          if (searchQuery) {
            const q = searchQuery.toLowerCase();
            const matchName = p.name.toLowerCase().includes(q);
            const matchCode = (p.code || '').toLowerCase().includes(q);
            const matchProv = (p.provider || '').toLowerCase().includes(q);
            if (!matchName && !matchCode && !matchProv) return false;
          }
          return true;
        });
      }, [products, categoryFilter, stockFilter, searchQuery]);

      // Matriz comparativa cruzada
      const comparisonMatrix = useMemo(() => {
        const servicesMap = new Map();
        providers.forEach(p => {
          p.catalog.forEach(item => {
            const key = item.service.trim();
            if (!servicesMap.has(key)) {
              servicesMap.set(key, []);
            }
            servicesMap.get(key).push({ providerName: p.name, cost: item.cost, stock: item.stock });
          });
        });

        const result = [];
        servicesMap.forEach((quotes, serviceName) => {
          quotes.sort((a, b) => a.cost - b.cost);
          const best = quotes[0];
          result.push({ serviceName, bestCost: best.cost, bestProvider: best.providerName, quotes });
        });
        return result;
      }, [providers]);

      // Guardar o Editar Producto
      const handleSaveProduct = (e) => {
        e.preventDefault();
        const f = e.target;
        const name = f.pName.value.trim();
        const category = f.pCat.value;
        const stock = parseInt(f.pStock.value, 10);
        const price = parseFloat(f.pPrice.value);
        const cost = parseFloat(f.pCost.value);
        const provider = f.pProv.value.trim() || 'General';

        if (editingProduct) {
          setProducts(prev => prev.map(p => p.id === editingProduct.id ? { ...p, name, category, stock, price, cost, provider } : p));
          addLog('Precios', `Modificación en ${name}`);
        } else {
          const code = `CC-${name.substring(0, 3).toUpperCase()}-${Math.floor(1000 + Math.random() * 9000)}`;
          setProducts(prev => [{ id: Date.now().toString(), name, code, category, type: 'Streaming', stock, price, cost, provider }, ...prev]);
          addLog('Altas', `Nuevo producto: ${name}`);
        }
        setShowProductModal(false);
        setEditingProduct(null);
      };

      // Guardar Nuevo Proveedor con Parseo Masivo
      const handleCreateProviderWithBatch = (e) => {
        e.preventDefault();
        if (!newProvName.trim()) return alert('Escribe el nombre del proveedor');

        const parsedCatalog = [];
        if (rawBatchText.trim()) {
          rawBatchText.split('\n').forEach(line => {
            const l = line.trim();
            if (!l) return;
            const priceMatch = l.match(/(\$|\bcosto:?\s*|\bprecio:?\s*)(\d+(\.\d+)?)/i) || l.match(/(\d+(\.\d+)?)\s*(mxn|pesos)?$/i);
            const stockMatch = l.match(/(\d+)\s*(u|disp|perfiles|pantallas)/i);
            const cost = priceMatch ? parseFloat(priceMatch[2] || priceMatch[1]) : 25;
            const stock = stockMatch ? parseInt(stockMatch[1], 10) : 5;
            let service = l.replace(/(\$|\bcosto:?\s*|\bprecio:?\s*)\d+(\.\d+)?/gi, '').replace(/(\d+)\s*(u|disp|perfiles|pantallas)/gi, '').replace(/[-–—:*•]/g, '').trim();
            if (service.length > 2) {
              parsedCatalog.push({ service, cost, stock });
            }
          });
        }

        const newProv = {
          id: Date.now().toString(),
          name: newProvName.trim(),
          channel: newProvContact.trim() || 'Contacto Directo',
          broadcast: newProvChannel.trim() || 'Sin notas adicionales',
          updated: new Date().toISOString().split('T')[0],
          status: 'Lote Activo',
          catalog: parsedCatalog
        };

        setProviders(prev => [newProv, ...prev]);
        setShowNewProviderModal(false);
        setNewProvName('');
        setNewProvContact('');
        setNewProvChannel('');
        setRawBatchText('');
        alert(`¡Proveedor guardado con ${parsedCatalog.length} servicios en su catálogo!`);
      };

      // Transferir de lote a inventario
      const handleTransferLoteItem = (item, provName) => {
        setProducts(prev => {
          const idx = prev.findIndex(p => p.name.toLowerCase() === item.service.toLowerCase());
          if (idx !== -1) {
            const u = [...prev];
            u[idx].stock += item.stock;
            u[idx].cost = item.cost;
            u[idx].provider = provName;
            return u;
          } else {
            return [{
              id: Date.now().toString(),
              name: item.service,
              code: `CC-${Math.floor(1000 + Math.random() * 9000)}`,
              category: 'Perfiles / Pantallas',
              type: 'Streaming',
              stock: item.stock,
              price: Math.round(item.cost * 1.6),
              cost: item.cost,
              provider: provName
            }, ...prev];
          }
        });
        addLog('Entradas', `Stock transferido: ${item.service} (${item.stock} u.)`);
        alert(`¡"${item.service}" transferido a tu inventario activo!`);
      };

      // Subida de imagen personalizada (Base64) desde iPhone
      const handleImageUpload = (e, field) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => {
            setConfig(prev => ({ ...prev, [field]: reader.result }));
          };
          reader.readAsDataURL(file);
        }
      };

      // Texto de comprobante / ticket
      const ticketPreviewText = `🧾 *${config.storeName}*\n*Comprobante de Compra #CC-${Math.floor(1000 + Math.random() * 9000)}*\n------------------------------\n👤 *Cliente:* ${ticketClient}\n🌸 *Servicio:* ${ticketService}\n💳 *Total Cobrado:* $${ticketAmount} MXN\n🔑 *Acceso / PIN:* ${ticketAccess}\n------------------------------\n¡Gracias por tu preferencia! Garantía total durante tus 30 días de servicio. 🍿`;

      // --- PANTALLA DE BLOQUEO PRIVADA CON PIN ---
      if (isLocked) {
        return (
          <div className="min-h-screen bg-lino flex flex-col justify-between items-center p-6 select-none">
            <div className="w-full max-w-sm rounded-3xl overflow-hidden shadow-sm border border-arena relative mt-4 h-52 bg-arenaBorde">
              <img src={config.coverUrl} alt="Portada" className="w-full h-full object-cover" />
              <div className="absolute inset-0 bg-gradient-to-t from-texto/70 via-texto/20 to-transparent flex flex-col justify-end p-5 text-white">
                <div className="flex items-center gap-1.5 mb-0.5">
                  <span className="text-sm">{config.logoIcon}</span>
                  <span className="text-[11px] font-bold tracking-widest uppercase opacity-90">click&cut</span>
                </div>
                <h1 className="text-xl font-bold tracking-tight">{config.storeName.replace('click&cut · ', '')}</h1>
                <p className="text-xs opacity-90 text-arena">{config.tagline}</p>
              </div>
            </div>

            <div className="w-full max-w-xs flex flex-col items-center my-auto">
              <span className="text-xs font-semibold tracking-wider text-textoMuted uppercase mb-3">Introduce tu PIN</span>
              <div className="flex gap-4 mb-8">
                {[0, 1, 2, 3].map(i => (
                  <div
                    key={i}
                    className={`w-3.5 h-3.5 rounded-full border transition-all duration-200 ${
                      pinInput.length > i
                        ? pinError ? 'bg-terracota border-terracota scale-110' : 'bg-salviaDark border-salviaDark scale-110'
                        : 'border-arenaBorde bg-white'
                    }`}
                  />
                ))}
              </div>

              <div className="grid grid-cols-3 gap-3 w-full">
                {[1, 2, 3, 4, 5, 6, 7, 8, 9].map(num => (
                  <button
                    key={num}
                    onClick={() => handlePinPress(num.toString())}
                    className="h-14 rounded-2xl bg-white border border-arena text-xl font-medium text-texto shadow-sm active:bg-arena/50 transition flex items-center justify-center font-mono-numbers"
                  >
                    {num}
                  </button>
                ))}
                <button
                  onClick={() => {
                    const url = prompt('Pega la URL de tu imagen o foto:');
                    if (url) setConfig(prev => ({ ...prev, coverUrl: url }));
                  }}
                  className="h-14 rounded-2xl bg-lino border border-arena text-[11px] text-textoMuted active:bg-arena flex items-center justify-center"
                >
                  Foto
                </button>
                <button
                  onClick={() => handlePinPress('0')}
                  className="h-14 rounded-2xl bg-white border border-arena text-xl font-medium text-texto shadow-sm active:bg-arena/50 transition flex items-center justify-center font-mono-numbers"
                >
                  0
                </button>
                <button
                  onClick={() => setPinInput(prev => prev.slice(0, -1))}
                  className="h-14 rounded-2xl bg-lino border border-arena text-xs font-semibold text-terracota active:bg-arena flex items-center justify-center"
                >
                  Borrar
                </button>
              </div>
            </div>

            <p className="text-[11px] text-textoMuted text-center pb-2">
              PIN por defecto: <strong className="font-mono-numbers">2408</strong> (personalízalo en Ajustes)
            </p>
          </div>
        );
      }

      // --- APLICACIÓN PRINCIPAL DESBLOQUEADA ---
      return (
        <div className="min-h-screen bg-lino flex flex-col pb-16 text-texto">
          {/* BARRA SUPERIOR IDÉNTICA A CAPTURA */}
          <header className="sticky top-0 z-40 bg-lino/95 backdrop-blur-md border-b border-arena px-3.5 py-2.5 flex items-center justify-between">
            <div className="flex items-center gap-2">
              <span className="text-base">{config.logoIcon}</span>
              <h2 className="text-sm font-bold tracking-tight text-texto truncate max-w-[170px]">
                {config.storeName}
              </h2>
            </div>

            <div className="flex items-center gap-1.5">
              {/* Botón Comprobante Rápido */}
              <button
                onClick={() => setShowTicketModal(true)}
                className="w-8 h-8 rounded-xl bg-white border border-arena flex items-center justify-center text-xs active:scale-95"
                title="Comprobante rápido"
              >
                🧾
              </button>

              {/* Botón Cierre de Caja */}
              <button
                onClick={() => setShowCashClose(true)}
                className="w-8 h-8 rounded-xl bg-salviaSuave border border-salvia/30 flex items-center justify-center text-xs text-salviaDark active:scale-95"
                title="Cierre de Caja"
              >
                🌙
              </button>

              {/* Botón Personalizar & Ajustes */}
              <button
                onClick={() => setShowSettingsModal(true)}
                className="w-8 h-8 rounded-xl bg-moradoPastel border border-moradoBorde flex items-center justify-center text-xs text-texto active:scale-95"
                title="Personalización y Ajustes"
              >
                🎨
              </button>

              {/* Botón Nuevo Registro */}
              <button
                onClick={() => { setEditingProduct(null); setShowProductModal(true); }}
                className="bg-[#3D3A37] text-white px-3 py-1.5 rounded-xl text-xs font-semibold flex items-center gap-1 active:scale-95 shadow-sm"
              >
                <span>+</span> Nuevo
              </button>

              {/* Botón Bloquear */}
              <button
                onClick={() => setIsLocked(true)}
                className="w-8 h-8 rounded-xl bg-white border border-arena flex items-center justify-center text-xs text-textoMuted active:scale-95"
                title="Bloquear sesión"
              >
                🔒
              </button>
            </div>
          </header>

          <main className="flex-1 p-3.5 max-w-xl mx-auto w-full space-y-4">
            {/* PESTAÑA: INVENTARIO DE STREAMING & PRECIOS */}
            {currentView === 'inventory' && (
              <div className="space-y-4">
                {/* TARJETA CABECERA RESUMEN */}

                      value={ticketAmount}
                      onChange={e => setTicketAmount(e.target.value)}
                      className="w-full bg-lino border border-arena rounded-xl p-2 mt-0.5 font-mono-numbers focus:outline-none"
                    />
                  </div>

                  <div>
                    <label className="text-textoMuted">Perfil / PIN / Nota de Acceso:</label>
                    <input
                      value={ticketAccess}
                      onChange={e => setTicketAccess(e.target.value)}
                      className="w-full bg-lino border border-arena rounded-xl p-2 mt-0.5 focus:outline-none"
                    />
                  </div>
                </div>

                {/* Vista previa idéntica a Captura 2 */}
                <div className="space-y-1 text-xs">
                  <span className="text-[11px] text-textoMuted">Vista Previa de la Nota de Compra:</span>
                  <div className="bg-lino border border-arena rounded-2xl p-3 text-[11px] font-mono whitespace-pre-line leading-relaxed text-texto">
                    {ticketPreviewText}
                  </div>
                </div>

                <div className="space-y-2 pt-1">
                  <a
                    href={`https://wa.me/?text=${encodeURIComponent(ticketPreviewText)}`}
                    target="_blank"
                    rel="noreferrer"
                    className="w-full bg-salviaDark text-white py-2.5 rounded-2xl text-xs font-semibold flex items-center justify-center gap-1.5 active:scale-95 transition"
                  >
                    <span>🔗</span> Enviar directo por WhatsApp
                  </a>

                  <div className="flex gap-2">
                    <button
                      onClick={() => setShowTicketModal(false)}
                      className="flex-1 bg-lino border border-arena py-2 rounded-xl text-xs font-medium text-texto"
                    >
                      Cerrar
                    </button>
                    <button
                      onClick={() => {
                        navigator.clipboard.writeText(ticketPreviewText);
                        alert('¡Ticket copiado al portapapeles!');
                      }}
                      className="flex-1 bg-[#3D3A37] text-white py-2 rounded-xl text-xs font-semibold"
                    >
                      Copiar Ticket
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* MODAL 2: AJUSTES & PERSONALIZACIÓN TOTAL (CAPTURA 3) */}
          {showSettingsModal && (
            <div className="fixed inset-0 bg-texto/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white border border-arena rounded-3xl p-5 max-w-sm w-full space-y-4 shadow-xl max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center border-b border-arena pb-2">
                  <h3 className="font-bold text-sm">Personalizar Tienda & Ajustes</h3>
                  <button onClick={() => setShowSettingsModal(false)} className="text-textoMuted font-bold text-sm">✕</button>
                </div>

                {/* Logo e Icono */}
                <div className="bg-lino border border-arena rounded-2xl p-3.5 space-y-2 text-xs">
                  <span className="text-[11px] text-textoMuted block leading-tight">
                    Sube tu imagen o logo personalizado para la cabecera, pantalla de bloqueo y comprobantes de click&cut.
                  </span>
                  <div className="flex items-center gap-3">
                    <div className="w-12 h-12 rounded-2xl bg-white border border-arena flex items-center justify-center text-xl shadow-sm">
                      {config.logoIcon}
                    </div>
                    <div className="flex-1 space-y-1.5">
                      <label className="cursor-pointer bg-white border border-arena text-texto px-3 py-1.5 rounded-xl text-[11px] font-semibold block text-center shadow-sm">
                        ⬆️ Subir logo desde equipo
                        <input type="file" accept="image/*" className="hidden" onChange={e => handleImageUpload(e, 'logoIcon')} />
                      </label>
                      <input
                        type="text"
                        value={config.logoIcon}
                        onChange={e => setConfig(prev => ({ ...prev, logoIcon: e.target.value }))}
                        placeholder="O escribe un emoji (ej. 🌿, 🍿, 🎬)..."
                        className="w-full bg-white border border-arena rounded-xl p-1.5 text-xs text-center focus:outline-none"
                      />
                    </div>
                  </div>
                </div>

                {/* Fotografía de Inicio (Pantalla de Bloqueo) */}
                <div className="bg-lino border border-arena rounded-2xl p-3.5 space-y-2 text-xs">
                  <div className="flex items-center gap-1.5">
                    <span>🖼️</span>
                    <span className="font-semibold text-xs">Fotografía de Inicio (Pantalla de Bloqueo)</span>
                  </div>
                  <p className="text-[11px] text-textoMuted">
                    Esta fotografía es la portada visual que aparece en la pantalla principal protegida por PIN.
                  </p>

                  <div className="flex items-center gap-3">
                    <div className="w-16 h-16 rounded-2xl overflow-hidden border border-arena bg-arenaBorde">
                      <img src={config.coverUrl} alt="Portada" className="w-full h-full object-cover" />
                    </div>
                    <div className="flex-1 space-y-1.5">
                      <label className="cursor-pointer bg-white border border-arena text-texto px-3 py-1.5 rounded-xl text-[11px] font-semibold block text-center shadow-sm">
                        ⬆️ Subir foto desde iPhone
                        <input type="file" accept="image/*" className="hidden" onChange={e => handleImageUpload(e, 'coverUrl')} />
                      </label>
                      <button
                        onClick={() => setConfig(prev => ({ ...prev, coverUrl: INITIAL_CONFIG.coverUrl }))}
                        className="text-[10px] text-terracota underline block mx-auto"
                      >
                        Restablecer predeterminada
                      </button>
                    </div>
                  </div>

                  {/* Presets Sugeridos */}
                  <div className="pt-1">
                    <span className="text-[10px] text-textoMuted block mb-1">O selecciona una fotografía sugerida:</span>
                    <div className="flex gap-2">
                      {PRESET_COVERS.map(pr => (
                        <button
                          key={pr.id}
                          onClick={() => setConfig(prev => ({ ...prev, coverUrl: pr.url }))}
                          className={`flex-1 p-1.5 rounded-xl border text-[11px] font-medium flex items-center justify-center gap-1 ${
                            config.coverUrl === pr.url ? 'bg-white border-salvia text-salviaDark font-bold' : 'bg-white/60 border-arena text-textoMuted'
                          }`}
                        >
                          <span>🖼️</span> {pr.label}
                        </button>
                      ))}
                    </div>
                  </div>

                  <input
                    type="text"
                    value={config.coverUrl}
                    onChange={e => setConfig(prev => ({ ...prev, coverUrl: e.target.value }))}
                    placeholder="O pega una URL de imagen..."
                    className="w-full bg-white border border-arena rounded-xl p-1.5 text-[11px] focus:outline-none"
                  />
                </div>

                {/* Nombre de la Tienda y Lema */}
                <div className="bg-lino border border-arena rounded-2xl p-3.5 space-y-2.5 text-xs">
                  <div>
                    <label className="text-textoMuted font-semibold">Nombre de la Tienda:</label>
                    <input
                      value={config.storeName}
                      onChange={e => setConfig(prev => ({ ...prev, storeName: e.target.value }))}
                      className="w-full bg-white border border-arena rounded-xl p-2 mt-0.5 focus:outline-none"
                    />
                  </div>

                  <div>
                    <label className="text-textoMuted font-semibold">Lema o Descripción (opcional):</label>
                    <input
                      value={config.tagline}
                      onChange={e => setConfig(prev => ({ ...prev, tagline: e.target.value }))}
                      className="w-full bg-white border border-arena rounded-xl p-2 mt-0.5 focus:outline-none"
                    />
                  </div>

                  <div>
                    <label className="text-textoMuted font-semibold">PIN Maestro de Acceso (4 dígitos):</label>
                    <input
                      type="password"
                      maxLength={4}
                      value={config.pin}
                      onChange={e => setConfig(prev => ({ ...prev, pin: e.target.value }))}
                      className="w-full bg-white border border-arena rounded-xl p-2 mt-0.5 font-mono-numbers text-center font-bold tracking-widest focus:outline-none"
                    />
                  </div>
                </div>

                <button
                  onClick={() => {
                    setShowSettingsModal(false);
                    alert('¡Configuración guardada exitosamente!');
                  }}
                  className="w-full bg-salviaDark text-white py-2.5 rounded-2xl text-xs font-semibold shadow-sm"
                >
                  Guardar Cambios
                </button>
              </div>
            </div>
          )}

          {/* MODAL 3: NUEVO PROVEEDOR & PARSEO MASIVO */}
          {showNewProviderModal && (
            <div className="fixed inset-0 bg-texto/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white border border-arena rounded-3xl p-5 max-w-sm w-full space-y-3 shadow-xl max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center border-b border-arena pb-2">
                  <h3 className="font-bold text-sm">Nuevo Proveedor / Stock Completo</h3>
                  <button onClick={() => setShowNewProviderModal(false)} className="text-textoMuted font-bold">✕</button>
                </div>

                <form onSubmit={handleCreateProviderWithBatch} className="space-y-2.5 text-xs">
                  <div>
                    <label className="text-textoMuted">Nombre del Mayorista:</label>
                    <input
                      value={newProvName}
                      onChange={e => setNewProvName(e.target.value)}
                      placeholder="Ej. Proveedor Alex (Telegram)"
                      required
                      className="w-full bg-lino border border-arena rounded-xl p-2 mt-0.5 focus:outline-none"
                    />
                  </div>

                  <div>
                    <label className="text-textoMuted">Canal / Contacto:</label>
                    <input
                      value={newProvContact}
                      onChange={e => setNewProvContact(e.target.value)}
                      placeholder="Telegram: @AlexStream · WA: +52..."
                      className="w-full bg-lino border border-arena rounded-xl p-2 mt-0.5 focus:outline-none"
                    />
                  </div>

                  <div>
                    <label className="text-textoMuted">Pegar Lista Completa de Telegram/WhatsApp:</label>
                    <textarea
                      rows={4}
                      value={rawBatchText}
                      onChange={e => setRawBatchText(e.target.value)}
                      placeholder="Ejemplo:&#10;Netflix 1 Pantalla 10 perfiles a $40&#10;Disney+ Estándar $22 5u&#10;Max Platino $25"
                      className="w-full bg-lino border border-arena rounded-xl p-2 mt-0.5 font-mono-numbers focus:outline-none"
                    />
                  </div>

                  <div className="flex gap-2 pt-1">
                    <button
                      type="button"
                      onClick={() => setShowNewProviderModal(false)}
                      className="flex-1 bg-lino border border-arena py-2 rounded-xl text-texto font-medium"
                    >
                      Cancelar
                    </button>
                    <button
                      type="submit"
                      className="flex-1 bg-salviaDark text-white py-2 rounded-xl font-semibold"
                    >
                      Guardar Lote
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL 4: ALTA O EDICIÓN DE PRODUCTO */}
          {showProductModal && (
            <div className="fixed inset-0 bg-texto/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white border border-arena rounded-3xl p-5 max-w-sm w-full space-y-3 shadow-xl">
                <div className="flex justify-between items-center border-b border-arena pb-2">
                  <h3 className="font-bold text-sm">{editingProduct ? 'Editar Servicio' : 'Nuevo Servicio'}</h3>
                  <button onClick={() => setShowProductModal(false)} className="text-textoMuted font-bold">✕</button>
                </div>

                <form onSubmit={handleSaveProduct} className="space-y-2.5 text-xs">
                  <div>
                    <label className="text-textoMuted">Nombre del Servicio:</label>
                    <input
                      name="pName"
                      defaultValue={editingProduct?.name || ''}
                      required
                      placeholder="Ej. Netflix 1 Pantalla (Perfil con PIN)"
                      className="w-full bg-lino border border-arena rounded-xl p-2 mt-0.5 focus:outline-none"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-textoMuted">Categoría:</label>
                      <select
                        name="pCat"
                        defaultValue={editingProduct?.category || 'Perfiles / Pantallas'}
                        className="w-full bg-lino border border-arena rounded-xl p-2 mt-0.5 focus:outline-none"
                      >
                        <option value="Perfiles / Pantallas">Perfiles / Pantallas</option>
                        <option value="Cuentas Completas">Cuentas Completas</option>
                        <option value="Streaming">Streaming</option>
                      </select>
                    </div>
                    <div>
                      <label className="text-textoMuted">Proveedor:</label>
                      <input
                        name="pProv"
                        defaultValue={editingProduct?.provider || 'Proveedor Alex (Telegram)'}
                        className="w-full bg-lino border border-arena rounded-xl p-2 mt-0.5 focus:outline-none"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-3 gap-2 font-mono-numbers">
                    <div>
                      <label className="text-textoMuted font-sans block text-[10px]">Stock:</label>
                      <input
                        type="number"
                        name="pStock"
                        defaultValue={editingProduct?.stock ?? 5}
                        required
                        className="w-full bg-lino border border-arena rounded-xl p-2 mt-0.5 focus:outline-none"
                      />
                    </div>
                    <div>
                      <label className="text-textoMuted font-sans block text-[10px]">Venta ($):</label>
                      <input
                        type="number"
                        name="pPrice"
                        defaultValue={editingProduct?.price || 85}
                        required
                        className="w-full bg-lino border border-arena rounded-xl p-2 mt-0.5 focus:outline-none"
                      />
                    </div>
                    <div>
                      <label className="text-textoMuted font-sans block text-[10px]">Costo ($):</label>
                      <input
                        type="number"
                        name="pCost"
                        defaultValue={editingProduct?.cost || 40}
                        required
                        className="w-full bg-lino border border-arena rounded-xl p-2 mt-0.5 focus:outline-none"
                      />
                    </div>
                  </div>

                  <div className="flex gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setShowProductModal(false)}
                      className="flex-1 bg-lino border border-arena py-2 rounded-xl text-texto font-medium"
                    >
                      Cancelar
                    </button>
                    <button
                      type="submit"
                      className="flex-1 bg-salviaDark text-white py-2 rounded-xl font-semibold"
                    >
                      Guardar
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL 5: CIERRE DE CAJA */}
          {showCashClose && (
            <div className="fixed inset-0 bg-texto/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white border border-arena rounded-3xl p-5 max-w-sm w-full space-y-4 shadow-xl">
                <div className="flex justify-between items-center border-b border-arena pb-2">
                  <h3 className="font-bold text-sm">Cierre de Caja Diario</h3>
                  <button onClick={() => setShowCashClose(false)} className="text-textoMuted font-bold">✕</button>
                </div>

                <div className="space-y-2 font-mono-numbers text-xs">
                  <div className="flex justify-between py-1 border-b border-arena">
                    <span className="font-sans text-textoMuted">Total de Servicios Activos:</span>
                    <strong className="text-texto">{products.length}</strong>
                  </div>
                  <div className="flex justify-between py-1 border-b border-arena">
                    <span className="font-sans text-textoMuted">Pantallas en Stock:</span>
                    <strong className="text-texto">{metrics.totalScreens}</strong>
                  </div>
                  <div className="flex justify-between py-2 text-sm">
                    <span className="font-sans font-bold text-salviaDark">Ganancia Estimada Stock:</span>
                    <strong className="text-salviaDark">+{formatMXN(metrics.potentialProfit)} MXN</strong>
                  </div>
                </div>

                <button
                  onClick={() => setShowCashClose(false)}
                  className="w-full bg-salviaDark text-white py-2.5 rounded-2xl text-xs font-semibold"
                >
                  Entendido
                </button>
              </div>
            </div>
          )}

          {/* MODAL 6: NUEVA NOTA */}
          {showNewNoteModal && (
            <div className="fixed inset-0 bg-texto/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white border border-arena rounded-3xl p-5 max-w-sm w-full space-y-3 shadow-xl">
                <div className="flex justify-between items-center border-b border-arena pb-2">
                  <h3 className="font-bold text-sm">Nueva Nota Suelta</h3>
                  <button onClick={() => setShowNewNoteModal(false)} className="text-textoMuted font-bold">✕</button>
                </div>

                <form onSubmit={e => {
                  e.preventDefault();
                  const f = e.target;
                  setNotes(prev => [{
                    id: Date.now().toString(),
                    title: f.nTitle.value.trim() || 'Nota de Ideas',
                    text: f.nText.value.trim(),
                    date: new Date().toISOString().split('T')[0]
                  }, ...prev]);
                  setShowNewNoteModal(false);
                }} className="space-y-2.5 text-xs">
                  <div>
                    <label className="text-textoMuted">Título:</label>
                    <input name="nTitle" required placeholder="Ej. Oferta Viki Rakuten" className="w-full bg-lino border border-arena rounded-xl p-2 mt-0.5 focus:outline-none" />
                  </div>
                  <div>
                    <label className="text-textoMuted">Nota / Idea:</label>
                    <textarea name="nText" rows={3} required placeholder="Escribe los detalles o cotización..." className="w-full bg-lino border border-arena rounded-xl p-2 mt-0.5 focus:outline-none" />
                  </div>
                  <div className="flex gap-2 pt-1">
                    <button type="button" onClick={() => setShowNewNoteModal(false)} className="flex-1 bg-lino border border-arena py-2 rounded-xl">Cancelar</button>
                    <button type="submit" className="flex-1 bg-salviaDark text-white py-2 rounded-xl font-semibold">Guardar</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
